# The Playwright suite (Follow-On Decision, Primary Deals fund return), ON DEMAND ONLY —
# never per merge, never on a schedule.
#
# BUILD FIRST, TEST IN BATCHES. This suite runs only when dispatched by a person
# (`gh workflow run e2e.yml --ref main`), by `land --promote secondaries --run-e2e`, or by `land`
# after a large change (the `land` PR in seq23/seq-bin defines "large"); the merge gate is
# `validate.yml` (lint, guards, middleware), and `land <pr>` deploys STAGING (`main`) on every
# merge. Production deploys only from a commit this workflow has passed on: a successful dispatch
# on main triggers `promote.yml`, which fast-forwards the `production` branch to this exact sha —
# what Cloudflare Pages serves at venturedeals.joinwestpeek.com. A red run leaves production where
# it is and is fixed first (bisect between the last green sha and this one). `timeout-minutes` is
# a fault detector (~4x normal), never a budget.
#
# Owner decision 2 Oct 2026: on demand only; supersedes the 26 Sep nightly cron.
# NOT `schedule`, NOT `push`, NOT `pull_request`: scripts/validate_workflows.mjs fails the merge
# gate if any of them comes back — the only trigger is `workflow_dispatch`.
name: e2e
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    # Normal: ~1 min including the Chromium install. 10 is a fault detector, never a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright
        env:
          CI: "1"
