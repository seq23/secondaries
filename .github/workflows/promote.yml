# Promote to production: fast-forward the `production` branch to a sha the production gate passes.
#
# Cloudflare Pages (Git integration) builds the `production` branch to venturedeals.joinwestpeek.com
# and every other branch as a preview — `main` at https://main.secondaries.pages.dev
# is the staging copy, rebuilt on every merge. Nothing else writes `production`.
#
# WHAT MAY SHIP (owner decision 2 Oct 2026: a small change ships on the fast check; e2e gates
# production only after a large change or when asked). The rule lives in
# `scripts/production_gate.mjs`, which this workflow runs for EVERY path — it restates none of it:
#   · workflow_run on `e2e` success: the sha that run passed. This is the path after a LARGE
#     change — `land` dispatches the suite (there is no cron) and its green fires this.
#   · workflow_dispatch with a sha and a `reason`: the path for a SMALL change. `land <pr>`
#     dispatches this with its small-change verdict as the reason; the gate then requires the fast
#     check (`validate.yml`) green on exactly that sha and the suite not known red on main.
#   · workflow_dispatch with a sha and no reason: REFUSED unless a completed `e2e` run on that
#     exact sha concluded success.
# "Large" is defined once, in the `large` block of `land` (seq23/seq-bin) — not here.
#
# A red `e2e` fires this too and is turned away by the `if` below: production stays put.
# Every promote records a GitHub Deployment (environment `production`) — what `land` reads back
# to know what production runs.
name: promote

on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to promote (default: main's head)."
        required: false
        default: ""
      reason:
        description: "Why it may ship without a green e2e run on it: land's small-change verdict (`land <pr>` passes it). Empty = a green e2e run on the sha is required."
        required: false
        default: ""

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the production branch
      actions: read # the gate reads e2e and validate runs
      deployments: write # the production record `land` reads
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the sha and pass the production gate
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then sha="$RUN_SHA"; else sha="$(git rev-parse "${INPUT_SHA:-origin/main}")"; fi
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          SHA="$sha" node scripts/production_gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Fast-forward production
        run: |
          set -euo pipefail
          sha="${{ steps.pick.outputs.sha }}"
          if git fetch -q origin production 2>/dev/null && [ "$(git rev-parse FETCH_HEAD)" = "$sha" ]; then
            echo "production already at $sha"; exit 0
          fi
          git push origin "$sha:refs/heads/production"
          echo "production -> $sha (Cloudflare Pages builds it to venturedeals.joinwestpeek.com)" >> "$GITHUB_STEP_SUMMARY"
      # One GitHub Deployment per production move (environment `production`): the record `land`
      # reads back after it dispatches this workflow, and reads first to judge what production has
      # not seen. Written even when the branch was already there, if no record names the sha yet.
      - name: Record the production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
          NOTE: ${{ steps.pick.outputs.note }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=production&per_page=1" --jq '.[0].sha // empty')"
          if [ "$live" = "$SHA" ]; then echo "already recorded: production = $SHA"; exit 0; fi
          id="$(jq -n --arg ref "$SHA" --arg d "promote.yml: $NOTE" '{ref: $ref, environment: "production", auto_merge: false, required_contexts: [], description: $d[0:140], production_environment: true}' \
                 | gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)"
          jq -n --arg d "promote.yml: $NOTE" '{state: "success", environment: "production", description: $d[0:140], environment_url: "https://venturedeals.joinwestpeek.com"}' \
                 | gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" --input - >/dev/null
          echo "recorded: GitHub deployment $id — production = $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
